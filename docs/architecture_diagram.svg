<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#425466"/>
    </marker>
    <style>
      .title { font: bold 29px Arial, sans-serif; fill: #142d4e; }
      .subtitle { font: 15px Arial, sans-serif; fill: #526579; }
      .heading { font: bold 16px Arial, sans-serif; fill: #142d4e; }
      .body { font: 13px Arial, sans-serif; fill: #24364b; }
      .small { font: 12px Arial, sans-serif; fill: #526579; }
      .node { fill: #f5f8fc; stroke: #6485a8; stroke-width: 1.5; rx: 12; }
      .control { fill: #e8f2ff; stroke: #4779b5; stroke-width: 1.5; rx: 12; }
      .evidence { fill: #e9f6ef; stroke: #468667; stroke-width: 1.5; rx: 12; }
      .output { fill: #fff3df; stroke: #c38a32; stroke-width: 1.5; rx: 12; }
      .edge { fill: none; stroke: #425466; stroke-width: 1.8; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #75869a; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1120" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" class="title">Autonomous Financial Research Agent</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">Hybrid Plan-and-Execute + ReAct | Multi-Source Evidence Synthesis</text>

  <rect x="480" y="105" width="440" height="58" class="control"/>
  <text x="700" y="130" text-anchor="middle" class="heading">1. User Research Question</text>
  <text x="700" y="149" text-anchor="middle" class="body">Company, objective, reporting period, constraints</text>

  <path d="M700 163 V190" class="edge"/>
  <rect x="480" y="190" width="440" height="62" class="node"/>
  <text x="700" y="215" text-anchor="middle" class="heading">2. Query Analyzer &amp; Disambiguation</text>
  <text x="700" y="235" text-anchor="middle" class="body">Resolve entity, ticker, scope and ambiguity</text>

  <path d="M700 252 V279" class="edge"/>
  <rect x="480" y="279" width="440" height="66" class="control"/>
  <text x="700" y="305" text-anchor="middle" class="heading">3. Research Planner</text>
  <text x="700" y="326" text-anchor="middle" class="body">Tasks, dependencies, source strategy, completion criteria</text>

  <path d="M700 345 V372" class="edge"/>
  <rect x="430" y="372" width="540" height="78" class="control"/>
  <text x="700" y="399" text-anchor="middle" class="heading">4. Agent Core &amp; Execution Controller</text>
  <text x="700" y="420" text-anchor="middle" class="body">Select action • Validate inputs • Enforce limits</text>
  <text x="700" y="438" text-anchor="middle" class="small">Maximum 20 tool calls per research run</text>

  <path d="M700 450 V476" class="edge"/>
  <rect x="480" y="476" width="440" height="58" class="node"/>
  <text x="700" y="500" text-anchor="middle" class="heading">5. Registered Tool Registry</text>
  <text x="700" y="520" text-anchor="middle" class="body">Schemas, permissions, timeouts, structured errors</text>

  <path d="M700 534 V559 H230 V584" class="edge"/>
  <path d="M700 559 V584" class="edge"/>
  <path d="M700 559 H1170 V584" class="edge"/>

  <rect x="65" y="584" width="330" height="90" class="evidence"/>
  <text x="230" y="609" text-anchor="middle" class="heading">Official &amp; Company Sources</text>
  <text x="230" y="631" text-anchor="middle" class="body">SEC EDGAR • Filings • Company profiles</text>
  <text x="230" y="651" text-anchor="middle" class="body">Earnings releases and disclosures</text>

  <rect x="535" y="584" width="330" height="90" class="evidence"/>
  <text x="700" y="609" text-anchor="middle" class="heading">Financial &amp; Analysis Tools</text>
  <text x="700" y="631" text-anchor="middle" class="body">Financial APIs • Earnings • Peer comparison</text>
  <text x="700" y="651" text-anchor="middle" class="body">Calculator and numerical validation</text>

  <rect x="1005" y="584" width="330" height="90" class="evidence"/>
  <text x="1170" y="609" text-anchor="middle" class="heading">Web &amp; News Sources</text>
  <text x="1170" y="631" text-anchor="middle" class="body">Web search • News • Sentiment</text>
  <text x="1170" y="651" text-anchor="middle" class="body">Source discovery and context</text>

  <path d="M230 674 V704 H700 V724" class="edge"/>
  <path d="M700 674 V724" class="edge"/>
  <path d="M1170 674 V704 H700" class="edge"/>

  <rect x="440" y="724" width="520" height="68" class="evidence"/>
  <text x="700" y="750" text-anchor="middle" class="heading">6. Evidence Collection &amp; Context Manager</text>
  <text x="700" y="772" text-anchor="middle" class="body">Claims, citations, source dates, units, periods, provenance</text>

  <rect x="70" y="824" width="370" height="96" class="node"/>
  <text x="255" y="850" text-anchor="middle" class="heading">Three-Layer Memory</text>
  <text x="255" y="873" text-anchor="middle" class="body">Short-term: active research state</text>
  <text x="255" y="892" text-anchor="middle" class="body">Vector: semantic document retrieval</text>
  <text x="255" y="911" text-anchor="middle" class="body">Episodic: prior run records</text>

  <path d="M560 792 V809 H255 V824" class="edge"/>
  <path d="M700 792 V824" class="edge"/>

  <rect x="510" y="824" width="380" height="96" class="control"/>
  <text x="700" y="850" text-anchor="middle" class="heading">7. Synthesis &amp; Conflict Resolution</text>
  <text x="700" y="873" text-anchor="middle" class="body">Compare definitions, dates, units, authority</text>
  <text x="700" y="892" text-anchor="middle" class="body">Preserve unresolved disagreements</text>
  <text x="700" y="911" text-anchor="middle" class="body">Cross-check important claims where possible</text>

  <rect x="960" y="824" width="370" height="96" class="node"/>
  <text x="1145" y="850" text-anchor="middle" class="heading">8. Error Handling &amp; Fallbacks</text>
  <text x="1145" y="873" text-anchor="middle" class="body">Timeouts • Retries • Rate limits</text>
  <text x="1145" y="892" text-anchor="middle" class="body">Fallback sources • Failure trace</text>
  <text x="1145" y="911" text-anchor="middle" class="body">No fabricated evidence</text>

  <path d="M890 872 H960" class="dashed"/>
  <path d="M510 872 H440" class="dashed"/>

  <path d="M700 920 V947" class="edge"/>
  <rect x="390" y="947" width="620" height="65" class="output"/>
  <text x="700" y="973" text-anchor="middle" class="heading">9. Fact Checking &amp; Report Generation</text>
  <text x="700" y="994" text-anchor="middle" class="body">Verify support • Cite claims • Disclose gaps and conflicts</text>

  <path d="M700 1012 V1035" class="edge"/>
  <rect x="290" y="1035" width="820" height="58" class="output"/>
  <text x="700" y="1059" text-anchor="middle" class="heading">Final Research Report or Explicitly Partial Report</text>
  <text x="700" y="1079" text-anchor="middle" class="body">Summary • Company Overview • Financial Analysis • Risks • Competition • Methodology</text>
</svg>
